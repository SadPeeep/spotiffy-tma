<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotiffy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Spotify Web Playback SDK -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sp-bg':      '#121212',
            'sp-surface': '#1e1e1e',
            'sp-accent':  '#1DB954',
            'sp-muted':   '#6b7280',
          }
        }
      }
    };
    window.BACKEND_URL  = 'https://spotiffy-tma-production.up.railway.app';
    window.BOT_USERNAME = 'sadadadasd_bot';
  </script>
</head>
<body class="bg-sp-bg text-white min-h-screen flex flex-col">

<main class="flex-1 overflow-y-auto pb-32">

  <!-- ===== HOME ===== -->
  <div id="tab-home" class="tab-content space-y-6">
    <div id="btn-my-wave" class="my-wave-section cursor-pointer">
      <div class="wave-blob wave-blob-yellow"></div>
      <div class="wave-blob wave-blob-purple"></div>
      <div class="wave-blob wave-blob-teal"></div>
      <div class="wave-blob wave-blob-orange"></div>
      <div class="wave-overlay"></div>
      <div class="wave-content">
        <div class="wave-play-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <p class="wave-title">&#1052;&#1086;&#1103; &#1042;&#1086;&#1083;&#1085;&#1072;</p>
        <p class="wave-sub">&#1055;&#1077;&#1088;&#1089;&#1086;&#1085;&#1072;&#1083;&#1100;&#1085;&#1099;&#1077; &#1088;&#1077;&#1082;&#1086;&#1084;&#1077;&#1085;&#1076;&#1072;&#1094;&#1080;&#1080;</p>
      </div>
    </div>
    <section class="px-4">
      <h2 class="font-bold text-lg mb-3">&#1053;&#1086;&#1074;&#1080;&#1085;&#1082;&#1080;</h2>
      <div id="new-releases" class="flex gap-4 overflow-x-auto pb-2 scrollbar-none"></div>
    </section>
    <section class="px-4 pb-6">
      <h2 class="font-bold text-lg mb-3">&#1056;&#1077;&#1082;&#1086;&#1084;&#1077;&#1085;&#1076;&#1091;&#1077;&#1084;&#1099;&#1077;</h2>
      <div id="featured-playlists" class="grid grid-cols-2 gap-3"></div>
    </section>
  </div>

  <!-- ===== SEARCH ===== -->
  <div id="tab-search" class="tab-content hidden p-4 space-y-4">
    <div class="relative pt-2">
      <i data-lucide="search" class="absolute left-3 top-1/2 mt-1 -translate-y-1/2 w-4 h-4 text-sp-muted"></i>
      <input id="search-input" type="text" placeholder="&#1040;&#1088;&#1090;&#1080;&#1089;&#1090;&#1099;, &#1090;&#1088;&#1077;&#1082;&#1080;, &#1072;&#1083;&#1100;&#1073;&#1086;&#1084;&#1099;..."
        class="w-full bg-sp-surface pl-10 pr-4 py-3 rounded-xl text-sm outline-none focus:ring-1 focus:ring-sp-accent" />
    </div>
    <div class="flex gap-2 overflow-x-auto scrollbar-none">
      <button class="filter-btn active" data-filter="track,artist,album">&#1042;&#1089;&#1077;</button>
      <button class="filter-btn" data-filter="track">&#1058;&#1088;&#1077;&#1082;&#1080;</button>
      <button class="filter-btn" data-filter="artist">&#1040;&#1088;&#1090;&#1080;&#1089;&#1090;&#1099;</button>
      <button class="filter-btn" data-filter="album">&#1040;&#1083;&#1100;&#1073;&#1086;&#1084;&#1099;</button>
    </div>
    <div id="genre-grid" class="grid grid-cols-2 gap-3"></div>
    <div id="search-results" class="space-y-1"></div>
  </div>

  <!-- ===== PROFILE ===== -->
  <div id="tab-profile" class="tab-content hidden p-4 space-y-5">
    <!-- User card -->
    <div class="flex items-center gap-4 bg-sp-surface rounded-2xl p-4 mt-2">
      <div class="relative">
        <img id="profile-avatar" src="" class="w-16 h-16 rounded-full object-cover hidden" />
        <div id="profile-avatar-placeholder" class="w-16 h-16 rounded-full bg-sp-bg flex items-center justify-center">
          <i data-lucide="user" class="w-8 h-8 text-sp-muted"></i>
        </div>
      </div>
      <div>
        <p id="profile-name" class="font-bold text-xl"></p>
        <p id="profile-username" class="text-sp-muted text-sm"></p>
      </div>
    </div>

    <!-- Spotify Connect (shown when NOT connected) -->
    <div id="spotify-connect-banner" class="hidden">
      <button id="btn-connect-spotify"
        class="w-full flex items-center justify-center gap-3 bg-sp-accent text-black font-bold rounded-2xl py-4 text-base active:opacity-80">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        &#1055;&#1086;&#1076;&#1082;&#1083;&#1102;&#1095;&#1080;&#1090;&#1100; Spotify &#1072;&#1082;&#1082;&#1072;&#1091;&#1085;&#1090;
      </button>
      <p class="text-xs text-sp-muted text-center mt-2">&#1044;&#1083;&#1103; &#1074;&#1086;&#1089;&#1087;&#1088;&#1086;&#1080;&#1079;&#1074;&#1077;&#1076;&#1077;&#1085;&#1080;&#1103; &#1087;&#1086;&#1083;&#1085;&#1099;&#1093; &#1090;&#1088;&#1077;&#1082;&#1086;&#1074; (&#1090;&#1088;&#1077;&#1073;&#1091;&#1077;&#1090;&#1089;&#1103; Spotify Premium)</p>
    </div>

    <!-- Spotify Connected badge (shown when connected) -->
    <div id="spotify-connected-badge" class="hidden items-center gap-3 bg-sp-surface rounded-xl px-4 py-3">
      <div class="w-2.5 h-2.5 rounded-full bg-sp-accent flex-shrink-0"></div>
      <span class="text-sm font-medium">Spotify Premium &#1072;&#1082;&#1090;&#1080;&#1074;&#1077;&#1085;</span>
      <span class="ml-auto text-xs text-sp-muted">&#1087;&#1086;&#1083;&#1085;&#1099;&#1077; &#1090;&#1088;&#1077;&#1082;&#1080; &#10003;</span>
    </div>

    <!-- Offline toggle -->
    <div class="flex items-center justify-between bg-sp-surface rounded-xl px-4 py-3">
      <div class="flex items-center gap-3">
        <i data-lucide="wifi-off" class="w-5 h-5 text-sp-muted"></i>
        <span class="text-sm font-medium">&#1054;&#1092;&#1092;&#1083;&#1072;&#1081;&#1085;-&#1088;&#1077;&#1078;&#1080;&#1084;</span>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="offline-toggle" class="sr-only peer" />
        <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:bg-sp-accent transition-colors"></div>
        <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
      </label>
    </div>

    <div class="flex gap-2">
      <button class="profile-tab active" data-ptab="favorites">&#1048;&#1079;&#1073;&#1088;&#1072;&#1085;&#1085;&#1086;&#1077;</button>
      <button class="profile-tab" data-ptab="playlists">&#1055;&#1083;&#1077;&#1081;&#1083;&#1080;&#1089;&#1090;&#1099;</button>
    </div>
    <div id="profile-favorites" class="profile-tab-content space-y-1">
      <p class="text-sp-muted text-sm text-center py-8">&#1047;&#1072;&#1075;&#1088;&#1091;&#1079;&#1082;&#1072;...</p>
    </div>
    <div id="profile-playlists" class="profile-tab-content hidden">
      <button id="btn-import-playlist" class="w-full flex items-center justify-center gap-2 border border-sp-accent text-sp-accent rounded-xl py-3 text-sm font-medium mb-4">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> &#1048;&#1084;&#1087;&#1086;&#1088;&#1090;&#1080;&#1088;&#1086;&#1074;&#1072;&#1090;&#1100; &#1087;&#1083;&#1077;&#1081;&#1083;&#1080;&#1089;&#1090; Spotify
      </button>
      <div id="playlists-list" class="space-y-1"></div>
    </div>
  </div>

</main>

<!-- ===== MINI PLAYER ===== -->
<div id="mini-player" class="hidden fixed bottom-16 left-0 right-0 bg-sp-surface border-t border-white/10 px-3 py-2 z-40">
  <div class="flex items-center gap-3">
    <div class="relative cursor-pointer flex-shrink-0" id="mini-player-expand">
      <img id="mini-cover" src="" class="w-11 h-11 rounded-lg object-cover" />
    </div>
    <div class="flex-1 min-w-0">
      <p id="mini-title" class="text-sm font-medium truncate"></p>
      <p id="mini-artist" class="text-xs text-sp-muted truncate"></p>
    </div>
    <button id="mini-like" class="p-2 text-sp-muted"><i data-lucide="heart" class="w-5 h-5"></i></button>
    <button id="mini-play-pause" class="p-2"><i id="mini-play-icon" data-lucide="play" class="w-6 h-6"></i></button>
  </div>
  <div class="mt-1 h-0.5 bg-white/10 rounded-full overflow-hidden">
    <div id="mini-progress" class="h-full bg-sp-accent transition-all" style="width:0%"></div>
  </div>
</div>

<!-- ===== BOTTOM NAV ===== -->
<nav class="fixed bottom-0 left-0 right-0 bg-sp-surface border-t border-white/10 flex z-50">
  <button class="nav-btn active" data-tab="home"><i data-lucide="home" class="w-5 h-5"></i><span>&#1043;&#1083;&#1072;&#1074;&#1085;&#1072;&#1103;</span></button>
  <button class="nav-btn" data-tab="search"><i data-lucide="search" class="w-5 h-5"></i><span>&#1055;&#1086;&#1080;&#1089;&#1082;</span></button>
  <button class="nav-btn" data-tab="profile" id="nav-profile-btn">
    <div class="nav-avatar-container">
      <img id="nav-avatar" src="" class="hidden w-6 h-6 rounded-full object-cover" />
      <i data-lucide="user" id="nav-profile-icon" class="w-5 h-5"></i>
    </div>
    <span>&#1055;&#1088;&#1086;&#1092;&#1080;&#1083;&#1100;</span>
  </button>
</nav>

<!-- ===== FULLSCREEN PLAYER ===== -->
<div id="fullscreen-player" class="hidden fixed inset-0 z-50 flex-col bg-sp-bg">
  <div id="player-bg" class="absolute inset-0 bg-cover bg-center filter blur-3xl opacity-30 scale-110"></div>
  <div class="relative z-10 flex flex-col h-full">
    <div class="flex items-center justify-between px-5 pt-5 pb-2">
      <button id="player-close" class="p-2"><i data-lucide="chevron-down" class="w-6 h-6"></i></button>
      <p class="text-sm font-semibold text-sp-muted uppercase tracking-widest">&#1057;&#1077;&#1081;&#1095;&#1072;&#1089; &#1080;&#1075;&#1088;&#1072;&#1077;&#1090;</p>
      <button id="player-share" class="p-2"><i data-lucide="share-2" class="w-5 h-5"></i></button>
    </div>
    <div class="flip-container flex-1 mx-5">
      <div class="flip-inner w-full h-full">
        <div class="flip-front flex flex-col items-center justify-center">
          <img id="player-cover" src="" class="w-72 h-72 rounded-2xl object-cover shadow-2xl" />
        </div>
        <div class="flip-back">
          <div id="lyrics-loading" class="flex justify-center py-8"><div class="loading-spinner"></div></div>
          <div id="lyrics-empty" class="hidden text-center text-sp-muted py-8">&#1058;&#1077;&#1082;&#1089;&#1090; &#1085;&#1077; &#1085;&#1072;&#1081;&#1076;&#1077;&#1085;</div>
          <div id="lyrics-container" class="space-y-1"></div>
        </div>
      </div>
    </div>
    <div class="px-5 pt-4">
      <div class="flex items-center justify-between mb-1">
        <div class="flex-1 min-w-0">
          <p id="player-title" class="font-bold text-xl truncate"></p>
          <button id="player-artist-btn" class="text-sp-muted text-sm hover:text-sp-accent transition-colors"></button>
        </div>
        <div class="flex items-center gap-2 ml-3">
          <button id="player-like" class="p-2 text-sp-muted"><i data-lucide="heart" class="w-6 h-6"></i></button>
          <button id="player-lyrics-btn" class="p-2 text-sp-muted"><i data-lucide="mic-2" class="w-5 h-5"></i></button>
          <button id="offline-save-btn" class="p-2 text-sp-muted"><i data-lucide="download" class="w-5 h-5"></i></button>
        </div>
      </div>
      <div class="mt-3">
        <input id="seek-bar" type="range" min="0" max="100" value="0" class="w-full" />
        <div class="flex justify-between text-xs text-sp-muted mt-1">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>
      <div class="flex items-center justify-between py-5">
        <button id="ctrl-shuffle" class="p-2 text-sp-muted"><i data-lucide="shuffle" class="w-5 h-5"></i></button>
        <button id="ctrl-prev" class="p-2"><i data-lucide="skip-back" class="w-7 h-7"></i></button>
        <button id="ctrl-play" class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-black shadow-lg">
          <i id="play-icon" data-lucide="play" class="w-7 h-7"></i>
        </button>
        <button id="ctrl-next" class="p-2"><i data-lucide="skip-forward" class="w-7 h-7"></i></button>
        <button id="ctrl-repeat" class="p-2 text-sp-muted"><i data-lucide="repeat" class="w-5 h-5"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- ===== ARTIST MODAL ===== -->
<div id="artist-modal" class="hidden fixed inset-0 z-50 flex-col bg-sp-bg overflow-y-auto">
  <div class="relative">
    <img id="artist-modal-img" src="" class="w-full h-64 object-cover" />
    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-sp-bg"></div>
    <button id="artist-modal-close" class="absolute top-4 left-4 p-2 bg-black/40 rounded-full">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
  </div>
  <div class="p-4 space-y-5 -mt-12 relative z-10">
    <div>
      <h2 id="artist-modal-name" class="font-black text-3xl"></h2>
      <p id="artist-modal-followers" class="text-sp-muted text-sm"></p>
    </div>
    <button id="artist-shuffle-all" class="flex items-center gap-2 bg-sp-accent text-black font-bold px-6 py-3 rounded-full text-sm">
      <i data-lucide="shuffle" class="w-4 h-4"></i> &#1055;&#1077;&#1088;&#1077;&#1084;&#1077;&#1096;&#1072;&#1090;&#1100; &#1074;&#1089;&#1077;
    </button>
    <div>
      <h3 class="font-bold text-lg mb-2">&#1055;&#1086;&#1087;&#1091;&#1083;&#1103;&#1088;&#1085;&#1099;&#1077; &#1090;&#1088;&#1077;&#1082;&#1080;</h3>
      <div id="artist-modal-tracks" class="space-y-1"></div>
    </div>
    <div>
      <h3 class="font-bold text-lg mb-2">&#1040;&#1083;&#1100;&#1073;&#1086;&#1084;&#1099;</h3>
      <div id="artist-modal-albums" class="grid grid-cols-2 gap-3"></div>
    </div>
  </div>
</div>

<!-- ===== IMPORT MODAL ===== -->
<div id="import-modal" class="hidden fixed inset-0 z-[60] bg-black/70 flex items-end">
  <div class="bg-sp-surface w-full rounded-t-2xl p-5 space-y-4">
    <h3 class="font-bold text-lg">&#1048;&#1084;&#1087;&#1086;&#1088;&#1090; &#1087;&#1083;&#1077;&#1081;&#1083;&#1080;&#1089;&#1090;&#1072;</h3>
    <input id="import-url-input" type="url" placeholder="https://open.spotify.com/playlist/..."
      class="w-full bg-sp-bg border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-1 focus:ring-sp-accent" />
    <div class="flex gap-3">
      <button id="import-cancel" class="flex-1 py-3 rounded-xl border border-white/20 text-sm">&#1054;&#1090;&#1084;&#1077;&#1085;&#1072;</button>
      <button id="import-confirm" class="flex-1 py-3 rounded-xl bg-sp-accent text-black font-bold text-sm">&#1048;&#1084;&#1087;&#1086;&#1088;&#1090;&#1080;&#1088;&#1086;&#1074;&#1072;&#1090;&#1100;</button>
    </div>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-[9999] bg-white text-black px-5 py-2.5 rounded-full shadow-xl text-sm font-medium">
  <span id="toast-content"></span>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spotiffy</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sp-bg':      '#121212',
            'sp-surface': '#1e1e1e',
            'sp-accent':  '#1DB954',
            'sp-muted':   '#6b7280',
          }
        }
      }
    };
    // Set your backend URL and bot username here after deploy:
    window.BACKEND_URL   = '';
    window.BOT_USERNAME  = '';
  </script>
</head>
<body class="bg-sp-bg text-white min-h-screen flex flex-col">

<!-- ========== TABS ========== -->
<main class="flex-1 overflow-y-auto pb-32">

  <!-- HOME -->
  <div id="tab-home" class="tab-content p-4 space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between pt-2">
      <div class="flex items-center gap-3">
        <img id="home-avatar" src="" class="w-10 h-10 rounded-full object-cover hidden" />
        <div>
          <p class="text-xs text-sp-muted">Привет,</p>
          <p id="home-username" class="font-bold text-lg">...</p>
        </div>
      </div>
      <button id="btn-my-wave" class="flex items-center gap-2 bg-sp-accent text-black font-bold px-4 py-2 rounded-full text-sm">
        <i data-lucide="radio" class="w-4 h-4"></i> Моя Волна
      </button>
    </div>

    <!-- New Releases -->
    <section>
      <h2 class="font-bold text-lg mb-3">Новинки</h2>
      <div id="new-releases" class="flex gap-4 overflow-x-auto pb-2 scrollbar-none"></div>
    </section>

    <!-- Featured Playlists -->
    <section>
      <h2 class="font-bold text-lg mb-3">Рекомендуемые</h2>
      <div id="featured-playlists" class="grid grid-cols-2 gap-3"></div>
    </section>
  </div>

  <!-- SEARCH -->
  <div id="tab-search" class="tab-content hidden p-4 space-y-4">
    <div class="relative">
      <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-sp-muted"></i>
      <input id="search-input" type="text" placeholder="Артисты, треки, альбомы..."
        class="w-full bg-sp-surface pl-10 pr-4 py-3 rounded-xl text-sm outline-none focus:ring-1 focus:ring-sp-accent" />
    </div>
    <!-- Filters -->
    <div class="flex gap-2 overflow-x-auto scrollbar-none">
      <button class="filter-btn active" data-filter="track,artist,album">Все</button>
      <button class="filter-btn" data-filter="track">Треки</button>
      <button class="filter-btn" data-filter="artist">Артисты</button>
      <button class="filter-btn" data-filter="album">Альбомы</button>
    </div>
    <!-- Genre grid -->
    <div id="genre-grid" class="grid grid-cols-2 gap-3"></div>
    <!-- Results -->
    <div id="search-results" class="space-y-1"></div>
  </div>

  <!-- PROFILE -->
  <div id="tab-profile" class="tab-content hidden p-4 space-y-5">
    <!-- User card -->
    <div class="flex items-center gap-4 bg-sp-surface rounded-2xl p-4">
      <img id="profile-avatar" src="" class="w-16 h-16 rounded-full object-cover hidden" />
      <div class="w-16 h-16 rounded-full bg-sp-bg flex items-center justify-center" id="profile-avatar-placeholder">
        <i data-lucide="user" class="w-8 h-8 text-sp-muted"></i>
      </div>
      <div>
        <p id="profile-name" class="font-bold text-xl"></p>
        <p id="profile-username" class="text-sp-muted text-sm"></p>
      </div>
    </div>

    <!-- Offline toggle -->
    <div class="flex items-center justify-between bg-sp-surface rounded-xl px-4 py-3">
      <div class="flex items-center gap-3">
        <i data-lucide="wifi-off" class="w-5 h-5 text-sp-muted"></i>
        <span class="text-sm font-medium">Оффлайн-режим</span>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input type="checkbox" id="offline-toggle" class="sr-only peer" />
        <div class="w-11 h-6 bg-gray-600 rounded-full peer peer-checked:bg-sp-accent transition-colors"></div>
        <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
      </label>
    </div>

    <!-- Tabs -->
    <div class="flex gap-2">
      <button class="profile-tab active" data-ptab="favorites">Избранное</button>
      <button class="profile-tab" data-ptab="playlists">Плейлисты</button>
    </div>

    <!-- Favorites -->
    <div id="profile-favorites" class="profile-tab-content space-y-1">
      <p class="text-sp-muted text-sm text-center py-8">Загрузка...</p>
    </div>

    <!-- Playlists -->
    <div id="profile-playlists" class="profile-tab-content hidden">
      <button id="btn-import-playlist" class="w-full flex items-center justify-center gap-2 border border-sp-accent text-sp-accent rounded-xl py-3 text-sm font-medium mb-4">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Импортировать плейлист Spotify
      </button>
      <div id="playlists-list" class="space-y-1"></div>
    </div>
  </div>

</main>

<!-- ========== MINI PLAYER ========== -->
<div id="mini-player" class="hidden fixed bottom-16 left-0 right-0 bg-sp-surface border-t border-white/10 px-3 py-2 z-40">
  <div class="flex items-center gap-3">
    <div class="relative cursor-pointer flex-shrink-0" id="mini-player-expand">
      <img id="mini-cover" src="" class="w-11 h-11 rounded-lg object-cover" />
      <div class="absolute inset-0 rounded-lg bg-black/20"></div>
    </div>
    <div class="flex-1 min-w-0 cursor-pointer" id="mini-player-expand-text">
      <p id="mini-title" class="text-sm font-medium truncate"></p>
      <p id="mini-artist" class="text-xs text-sp-muted truncate"></p>
    </div>
    <button id="mini-like" class="p-2 text-sp-muted">
      <i data-lucide="heart" class="w-5 h-5"></i>
    </button>
    <button id="mini-play-pause" class="p-2">
      <i id="mini-play-icon" data-lucide="play" class="w-6 h-6"></i>
    </button>
  </div>
  <!-- Progress bar -->
  <div class="mt-1 h-0.5 bg-white/10 rounded-full overflow-hidden">
    <div id="mini-progress" class="h-full bg-sp-accent transition-all" style="width:0%"></div>
  </div>
</div>

<!-- ========== BOTTOM NAV ========== -->
<nav class="fixed bottom-0 left-0 right-0 bg-sp-surface border-t border-white/10 flex justify-around py-1 z-50">
  <button class="nav-btn active" data-tab="home">
    <i data-lucide="home" class="w-5 h-5"></i>
    <span>Главная</span>
  </button>
  <button class="nav-btn" data-tab="search">
    <i data-lucide="search" class="w-5 h-5"></i>
    <span>Поиск</span>
  </button>
  <button class="nav-btn" data-tab="profile">
    <i data-lucide="user" class="w-5 h-5"></i>
    <span>Профиль</span>
  </button>
</nav>

<!-- ========== FULLSCREEN PLAYER ========== -->
<div id="fullscreen-player" class="hidden fixed inset-0 z-50 flex-col bg-sp-bg">
  <!-- Blurred background -->
  <div id="player-bg" class="absolute inset-0 bg-cover bg-center filter blur-3xl opacity-30 scale-110"></div>
  <div class="relative z-10 flex flex-col h-full">
    <!-- Top bar -->
    <div class="flex items-center justify-between px-5 pt-5 pb-2">
      <button id="player-close" class="p-2">
        <i data-lucide="chevron-down" class="w-6 h-6"></i>
      </button>
      <p class="text-sm font-semibold text-sp-muted uppercase tracking-widest">Сейчас играет</p>
      <button id="player-share" class="p-2">
        <i data-lucide="share-2" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Flip container (cover / lyrics) -->
    <div class="flip-container flex-1 mx-5">
      <div class="flip-inner w-full h-full">
        <!-- Front: cover -->
        <div class="flip-front flex flex-col items-center justify-center gap-4">
          <img id="player-cover" src="" class="w-72 h-72 rounded-2xl object-cover shadow-2xl" />
        </div>
        <!-- Back: lyrics -->
        <div class="flip-back bg-sp-surface rounded-2xl overflow-y-auto p-4">
          <div id="lyrics-loading" class="flex justify-center py-8">
            <div class="loading-spinner"></div>
          </div>
          <div id="lyrics-empty" class="hidden text-center text-sp-muted py-8">Текст не найден</div>
          <div id="lyrics-container" class="space-y-1"></div>
        </div>
      </div>
    </div>

    <!-- Track info -->
    <div class="px-5 pt-4">
      <div class="flex items-center justify-between mb-1">
        <div class="flex-1 min-w-0">
          <p id="player-title" class="font-bold text-xl truncate"></p>
          <button id="player-artist-btn" class="text-sp-muted text-sm truncate hover:text-sp-accent transition-colors"></button>
        </div>
        <div class="flex items-center gap-2 ml-3">
          <button id="player-like" class="p-2 text-sp-muted">
            <i data-lucide="heart" class="w-6 h-6"></i>
          </button>
          <button id="player-lyrics-btn" class="p-2 text-sp-muted">
            <i data-lucide="mic-2" class="w-5 h-5"></i>
          </button>
          <button id="offline-save-btn" class="p-2 text-sp-muted">
            <i data-lucide="download" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Seek bar -->
      <div class="mt-3">
        <input id="seek-bar" type="range" min="0" max="100" value="0" class="w-full" />
        <div class="flex justify-between text-xs text-sp-muted mt-1">
          <span id="time-current">0:00</span>
          <span id="time-total">0:00</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-between py-5">
        <button id="ctrl-shuffle" class="p-2 text-sp-muted">
          <i data-lucide="shuffle" class="w-5 h-5"></i>
        </button>
        <button id="ctrl-prev" class="p-2">
          <i data-lucide="skip-back" class="w-7 h-7"></i>
        </button>
        <button id="ctrl-play" class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-black shadow-lg">
          <i id="play-icon" data-lucide="play" class="w-7 h-7"></i>
        </button>
        <button id="ctrl-next" class="p-2">
          <i data-lucide="skip-forward" class="w-7 h-7"></i>
        </button>
        <button id="ctrl-repeat" class="p-2 text-sp-muted">
          <i data-lucide="repeat" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ========== ARTIST MODAL ========== -->
<div id="artist-modal" class="hidden fixed inset-0 z-50 flex-col bg-sp-bg overflow-y-auto">
  <div class="relative">
    <img id="artist-modal-img" src="" class="w-full h-64 object-cover" />
    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-sp-bg"></div>
    <button id="artist-modal-close" class="absolute top-4 left-4 p-2 bg-black/40 rounded-full">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
  </div>
  <div class="p-4 space-y-5 -mt-12 relative z-10">
    <div>
      <h2 id="artist-modal-name" class="font-black text-3xl"></h2>
      <p id="artist-modal-followers" class="text-sp-muted text-sm"></p>
    </div>
    <button id="artist-shuffle-all" class="flex items-center gap-2 bg-sp-accent text-black font-bold px-6 py-3 rounded-full text-sm">
      <i data-lucide="shuffle" class="w-4 h-4"></i> Перемешать все
    </button>
    <div>
      <h3 class="font-bold text-lg mb-2">Популярные треки</h3>
      <div id="artist-modal-tracks" class="space-y-1"></div>
    </div>
    <div>
      <h3 class="font-bold text-lg mb-2">Альбомы</h3>
      <div id="artist-modal-albums" class="grid grid-cols-2 gap-3"></div>
    </div>
  </div>
</div>

<!-- ========== IMPORT MODAL ========== -->
<div id="import-modal" class="hidden fixed inset-0 z-60 bg-black/70 flex items-end">
  <div class="bg-sp-surface w-full rounded-t-2xl p-5 space-y-4">
    <h3 class="font-bold text-lg">Импорт плейлиста</h3>
    <input id="import-url-input" type="url" placeholder="https://open.spotify.com/playlist/..."
      class="w-full bg-sp-bg border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-1 focus:ring-sp-accent" />
    <div class="flex gap-3">
      <button id="import-cancel" class="flex-1 py-3 rounded-xl border border-white/20 text-sm">Отмена</button>
      <button id="import-confirm" class="flex-1 py-3 rounded-xl bg-sp-accent text-black font-bold text-sm">Импортировать</button>
    </div>
  </div>
</div>

<!-- ========== TOAST ========== -->
<div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 z-[9999] bg-white text-black px-5 py-2.5 rounded-full shadow-xl text-sm font-medium">
  <span id="toast-content"></span>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
